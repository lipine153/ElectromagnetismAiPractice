<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电磁学闯关游戏</title>
    <!--背景样式-->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">

    <!--引入polyfill-->
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>

    <!-- 引入KaTeX CSS + JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <!-- 自动渲染页面所有公式 -->
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <!--自定义样式-->
    <link href="./css/src.css" rel="stylesheet">

</head>
<body>
    <canvas id="particles"></canvas>
    <h1 id="mainhead"> 电磁学计算大闯关 </h1>
    <div class="container w-full min-h-screen p-4 md:p-8">
        <!-- 顶部状态栏 -->
        <header class="flex flex-wrap justify-between items-center mb-8 gap-4">
            <div class="flex gap-6 text-lg">
                <div>当前关卡：<span id="levelNum" class="text-cyan-300">1</span>/10</div>
                <div>总分：<span id="score" class="text-yellow-400">0</span></div>
                <div>剩余时间：<span id="timer" class="text-red-400">120</span>s</div>
            </div>
        </header>

        <!-- 关卡选择 -->
        <div class="flex flex-wrap gap-2 mb-8 justify-center" id="levelSelect">
            <a  href="simulate.html" class = "px-4 py-2 rounded-lg border border-indigo-400 hover:bg-indigo-600 transition">
                模拟
            </a>
        </div>

        <!-- 主游戏区 -->
        <main class="grid grid-cols-1 lg:grid-cols-3 gap-8 items-start">
            <!-- 左侧：题目、已知条件、公式、待选数值 -->
            <div class="lg:col-span-1 bg-slate-900/70 rounded-2xl p-6 border border-indigo-500/30">
                <h2 class="text-xl text-cyan-300 mb-4 border-b border-indigo-400 pb-2">
                    计算题题干
                </h2>
                <div id="questionText" class="param-text">
>
                </div>
                <div class="mt-6">
                    <h3 class="text-lg text-purple-300 mb-3">可选计算结果（拖拽填入）</h3>
                    <div id="numDragBox" class="flex flex-wrap gap-3"></div>
                </div>
                <div class="mt-8 flex gap-4">
                    <button id="resetBtn" class="px-5 py-2 bg-orange-600 hover:bg-orange-700 rounded-lg transition">
                        <i class="fa fa-refresh mr-1"></i>重置作答
                    </button>
                    <button id="submitBtn" class="px-5 py-2 bg-green-600 hover:bg-green-700 rounded-lg transition">
                        <i class="fa fa-check mr-1"></i>提交计算结果
                    </button>
                </div>
            </div>

            <!-- 右侧：物理模型 + 答题填空区 -->
            <div class="lg:col-span-2 bg-slate-900/70 rounded-2xl p-6 border border-indigo-500/30">
                <div id="physicsModel" class="min-h-[420px] flex flex-col items-center justify-center"></div>
                <div class="mt-6 grid grid-cols-2 md:grid-cols-3 gap-4" id="calcDropBox"></div>
            </div>
        </main>
    </div>

    <!-- 结果弹窗 -->
    <div class="modal" id="resultModal">
        <div class="bg-slate-800 p-8 rounded-2xl border-2 border-purple-500 text-center max-w-md w-full mx-4">
            <div id="modalIcon" class="text-6xl mb-4"></div>
            <h2 id="modalTitle" class="text-2xl mb-4"></h2>
            <p id="modalDesc" class="text-gray-300 mb-6"></p>
            <div class="flex gap-4 justify-center">
                <button id="modalClose" class="px-6 py-2 bg-indigo-600 rounded-lg hover:bg-indigo-700">确定</button>
                <button id="nextLevel" class="px-6 py-2 bg-green-600 rounded-lg hover:bg-green-700 hidden">下一关</button>
            </div>
        </div>
    </div>
    <!--javascript-->
    <script src="./src/main.js"></script>

</body>
</html>
