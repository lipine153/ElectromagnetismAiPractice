<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>电磁学沙盒 · 三维场可视化</title>
</head>
<body class="is-sim">
  <div id="viewport"></div>

  <header class="sim-topbar">
    <span class="sim-topbar__title">电磁学沙盒</span>
    <div class="seg" role="group" aria-label="显示哪个场">
      <button type="button" class="seg__btn" data-field="E">电场 E</button>
      <button type="button" class="seg__btn" data-field="B">磁场 B</button>
      <button type="button" class="seg__btn" data-field="both">同时</button>
    </div>
    <button id="toggle-arrows" type="button" class="btn btn--sm is-on" aria-pressed="true">方向箭头</button>
    <span class="sim-topbar__spacer"></span>
    <div id="sim-legend" class="legend" hidden>
      <div id="legend-e" class="legend__row" hidden>
        <span class="legend__bar legend__bar--e"></span><em>电场 弱→强</em>
      </div>
      <div id="legend-b" class="legend__row" hidden>
        <span class="legend__bar legend__bar--b"></span><em>磁场 弱→强</em>
      </div>
    </div>
    <button id="sim-reset" type="button" class="btn btn--sm">清空</button>
  </header>

  <aside id="sim-drawer" class="drawer">
    <button id="drawer-toggle" type="button" class="drawer__toggle" aria-expanded="false"
            aria-controls="drawer-body">要素</button>
    <div id="drawer-body" class="drawer__body">
      <section class="drawer__section">
        <h3 class="drawer__title">电场源</h3>
        <div id="palette" class="palette"></div>
      </section>
      <section id="props" class="drawer__section" hidden>
        <h3 class="drawer__title">属性</h3>
        <div id="props-body"></div>
      </section>
    </div>
  </aside>

  <footer id="sim-hint" class="sim-hint">
    点左侧「要素」添加电荷；拖动圆点移动，左键旋转视角，滚轮缩放。
  </footer>

  <!-- Wasm 胶水代码（经典脚本，挂载全局 FieldLineModule） -->
  <script src="./bin/field_line.js"></script>
  <script type="module" src="/src/simulate.ts"></script>
</body>
</html>
