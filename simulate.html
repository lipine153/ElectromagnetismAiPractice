<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Wasm + Three.js 磁力线可视化</title>
    <style>
        body { margin: 0; overflow: hidden; background: #0a0a0f; }
        canvas { display: block; }
    </style>
</head>
<body>
<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
}
</script>

<!-- 先加载 Wasm 胶水代码，全局挂载 FieldLineModule 工厂函数 -->
<script src="./bin/field_line.js"></script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Line2 } from 'three/addons/lines/Line2.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
import { LineGeometry } from 'three/addons/lines/LineGeometry.js';

// ========== 1. 初始化场景 ==========
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0f);

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 100);
camera.position.set(6, 6, 5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.AxesHelper(3));
scene.add(new THREE.GridHelper(10, 10, 0x333344, 0x222233));

// ========== 2. 初始化 Wasm 并渲染 ==========
// 调用全局工厂函数，返回完整实例
FieldLineModule().then(wasm => {
    console.log('Wasm 初始化完成');

    // ========== 批量生成多条磁力线 ==========
    const lineCount = 12;       // 磁力线总条数，绕z轴均匀分布
    const startRadius = 1.5;    // 起点到z轴的距离
    const startZ = 1.0;         // 起点z坐标
    const stepSize = 0.03;      // 积分步长（越小越密）
    const maxSteps = 100000;       // 单条线最大步数

    for (let i = 0; i < lineCount; i++) {
        // 计算当前方位角，绕z轴均匀分布
        const angle = (i / lineCount) * Math.PI * 2;
        const startX = startRadius * Math.cos(angle);
        const startY = startRadius * Math.sin(angle);

        // 调用Wasm计算单条磁力线
        const countPtr = wasm._malloc(4);
        const dataPtr = wasm._traceFieldLine(
            startX, startY, startZ,
            stepSize,
            maxSteps,
            countPtr
        );
        const pointCount = wasm.getValue(countPtr, 'i32');
        if (pointCount <= 0) {
            wasm._free(countPtr);
            continue;
        }

        // 读取顶点数据
        const floatData = new Float32Array(
            wasm.HEAPF32.buffer,
            dataPtr,
            pointCount * 4
        );

        // 提取坐标与颜色
        const positions = [];
        const colors = [];
        const colorTmp = new THREE.Color();

        let maxB = -Infinity, minB = Infinity;
        for (let j = 0; j < pointCount; j++) {
            const b = floatData[j*4 + 3];
            maxB = Math.max(maxB, b);
            minB = Math.min(minB, b);
        }
        const range = maxB - minB || 1;

        for (let j = 0; j < pointCount; j++) {
            positions.push(
                floatData[j*4 + 0],
                floatData[j*4 + 1],
                floatData[j*4 + 2]
            );
            const t = (floatData[j*4 + 3] - minB) / range;
            colorTmp.setHSL(0.65 - 0.65 * t, 1.0, 0.6);
            colors.push(colorTmp.r, colorTmp.g, colorTmp.b);
        }

        // 渲染当前磁力线
        const geometry = new LineGeometry();
        geometry.setPositions(positions);
        geometry.setColors(colors);

        const material = new LineMaterial({
            linewidth: 2.5,
            vertexColors: true,
            transparent: false,
            opacity: 0.9
        });
        material.resolution.set(innerWidth, innerHeight);

        const fieldLine = new Line2(geometry, material);
        scene.add(fieldLine);

        // 释放内存
        wasm._freeFieldLine(dataPtr);
        wasm._free(countPtr);
    }

    console.log('所有磁力线渲染完成');
}).catch(err => {
    console.error('Wasm 初始化失败:', err);
});

// ========== 3. 渲染循环 ==========
function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    scene.traverse(obj => {
        if (obj.material?.resolution) {
            obj.material.resolution.set(innerWidth, innerHeight);
        }
    });
});
</script>
</body>
</html>
